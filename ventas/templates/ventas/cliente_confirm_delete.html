{% extends 'ventas/base.html' %}

{% block content %}
<div class="max-w-md mx-auto space-y-6 pb-12">

    <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center space-y-4">
        <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h2 class="text-lg font-black text-gray-800">¿Eliminar cliente?</h2>
        <p class="text-xs text-gray-500">
            ¿Estás seguro de que deseas eliminar al cliente <strong class="text-gray-800">{{ cliente.nombre }}</strong>? Esta acción no borrará el historial de ventas anteriores, pero desvinculará al cliente de futuras búsquedas.
        </p>

        <form method="POST" class="pt-4 flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'lista_clientes' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-5 py-3 rounded-2xl transition">
                Cancelar
            </a>
            <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-6 py-3 rounded-2xl transition shadow-md shadow-rose-600/20">
                Sí, Eliminar
            </button>
        </form>
    </div>

</div>
{% endblock %}
