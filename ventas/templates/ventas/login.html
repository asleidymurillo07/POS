<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | La Pasadita POS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1321;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-200">

    <!-- Tarjeta Principal -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Adorno de luz de fondo -->
        <div class="absolute -top-16 -left-16 w-32 h-32 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-32 h-32 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Encabezado con Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 shadow-lg shadow-blue-500/30 mb-4">
                <i class="fa-solid fa-store text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-wide">La Pasadita</h1>
            <p class="text-xs font-bold text-blue-400 tracking-wider uppercase mt-1">Point of Sale</p>
            <p class="text-sm text-slate-400 mt-3">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <!-- Mensajes de Error de Django -->
        {% if form.errors %}
            <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-base"></i>
                <span>Usuario o contraseña incorrectos. Inténtalo de nuevo.</span>
            </div>
        {% endif %}

        <!-- Formulario de Login -->
        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            <!-- Campo Usuario -->
            <div>
                <label for="id_username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Usuario
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" 
                           name="username" 
                           id="id_username" 
                           required 
                           autofocus
                           placeholder="Tu nombre"
                           class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="id_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Contraseña
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" 
                           name="password" 
                           id="id_password" 
                           required 
                           placeholder="••••••••"
                           class="w-full pl-10 pr-10 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                    
                    <!-- Botón Mostrar/Ocultar Contraseña -->
                    <button type="button" 
                            onclick="togglePassword()" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
                        <i class="fa-solid fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Redirección opcional en Django -->
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <!-- Botón de Ingreso -->
            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-600/30 transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 mt-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Pie de página -->
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-500 flex items-center justify-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Sistema de Control de Ventas v1.0
            </p>
        </div>
    </div>

    <!-- Script para ver/ocultar contraseña -->
    <script>
        function togglePassword() {
            const passInput = document.getElementById('id_password');
            const icon = document.getElementById('toggleIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
